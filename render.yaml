services:
  - type: web
    name: reachinbox-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: reachinbox-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: reachinbox-redis
          type: redis
          property: port
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: "10000"
      - key: FRONTEND_URL
        sync: false
      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      # GitHub OAuth
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      # Slack
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        sync: false

  - type: redis
    name: reachinbox-redis
    plan: free
    ipAllowList: []

databases:
  - name: reachinbox-db
    databaseName: reachinbox
    user: reachinbox
    plan: free
